airbnb:
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      # account: DVMZFSM-KC22031
      # user: dbt

      role: TRANSFORM
      private_key_path: "{{ env_var('PRIVATE_KEY_PATH') }}"
      private_key_passphrase: "{{ env_var('PRIVATE_KEY_PASSPHRASE') }}"
      # private_key_path: "secrets\\dbt_snowflake_pvt_key.p8"
      # private_key_passphrase: "q"

      database: AIRBNB
      schema: "DBT_{{ env_var('DBT_ENV_NAME') | upper | trim }}"
      threads: 6
      warehouse: COMPUTE_WH

    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      # account: DVMZFSM-KC22031
      # user: dbt

      role: TRANSFORM
      private_key_path: "{{ env_var('PRIVATE_KEY_PATH') }}"
      private_key_passphrase: "{{ env_var('PRIVATE_KEY_PASSPHRASE') }}"
      # private_key_path: "secrets\\dbt_snowflake_pvt_key.p8"
      # private_key_passphrase: "q"

      database: AIRBNB
      schema: "DBT_{{ env_var('DBT_ENV_NAME') | upper | trim }}"
      threads: 6
      warehouse: COMPUTE_WH

    staging:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      # account: DVMZFSM-KC22031
      # user: dbt

      role: TRANSFORM
      private_key_path: "{{ env_var('PRIVATE_KEY_PATH') }}"
      private_key_passphrase: "{{ env_var('PRIVATE_KEY_PASSPHRASE') }}"
      # private_key_path: "secrets\\dbt_snowflake_pvt_key.p8"
      # private_key_passphrase: "q"

      database: AIRBNB
      schema: "DBT_{{ env_var('DBT_ENV_NAME') | upper | trim }}"
      threads: 6
      warehouse: COMPUTE_WH

  target: dev
