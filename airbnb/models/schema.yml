# version: 2 [Now optional]

models:
  - name: dim_listings_cleansed
    description: Cleansed table which contains Airbnb listings.
    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 1000

    columns:
      - name: listing_id
        description: Primary key for the listing
        data_tests:
          - unique
          - not_null

      - name: host_id
        description: The host's id. Refrences the host table
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        description: Type of the apartment / room
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']

      - name: minimum_nights
        description: '{{ doc("dim_listings_cleansed__minimum_nights") }}'
        data_tests:
          - positive_values

  - name: dim_hosts_cleansed
    description: Cleansed table which contains Airbnb hosts details.
    config:
      contract:
        enforced: true

      meta:
        constraints:
          - type: primary_key
            columns: [host_id]
            warn_unsupported: False
    columns:
      - name: host_id
        description: Primary key for the hosts
        data_type: integer
        constraints:
          - type: not_null
          - type: unique
            warn_unsupported: False
        data_tests:
          - unique
          - not_null

      - name: host_name
        data_type: string
        constraints:
          - type: not_null
            warn_unsupported: false
        data_tests:
          - not_null

      - name: is_superhost
        description: Information of the host being superhost or not
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ['t', 'f']

      - name: updated_at
        data_type: timestamp

      - name: created_at
        data_type: timestamp

  - name: dim_listings_w_hosts
    columns:
      - name: price
        data_tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: number

          - dbt_expectations.expect_column_quantile_values_to_be_between:
              arguments:
                quantile: .99
                min_value: 50 # (Optional)
                max_value: 500 # (Optional)

          - dbt_expectations.expect_column_max_to_be_between:
              arguments:
                max_value: 5000 # (Optional)
                config:
                  severity: warn

  - name: fct_reviews
    columns:
      - name: listing_id
        data_tests:
          - not_null

      - name: review_date
        data_tests:
          - not_null

      - name: review_sentiment
        data_tests:
          - accepted_values:
              arguments:
                values: ['positive', 'neutral', 'negative', 'Positive']
